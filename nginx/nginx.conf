# AI Abyss — nginx reverse proxy configuration
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  OPTIONAL: This reverse proxy is NOT required for development or   │
# │  basic deployment. Run AI Abyss directly with:                     │
# │                                                                    │
# │    uvicorn src.main:app --host 0.0.0.0 --port 8443                │
# │                                                                    │
# │  The nginx proxy adds:                                             │
# │    • TLS termination with JA3 fingerprint extraction (optional)    │
# │    • Rate limiting on admin endpoints                              │
# │    • HTTP → HTTPS redirect                                         │
# │    • Request buffering control for slow-drip responses             │
# │                                                                    │
# │  Without nginx, the only feature you lose is JA3/TLS fingerprint  │
# │  classification. All other signals (UA, IP, behaviour, headers)    │
# │  work standalone.                                                  │
# └─────────────────────────────────────────────────────────────────────┘
#
# TLS FINGERPRINTING (optional)
#
# To enable JA3/JA4 extraction, nginx must be compiled with a fingerprint module.
# Recommended: https://github.com/HanadaLee/ngx_ssl_fingerprint_module
# (supports JA3 + JA4 + HTTP/2 fingerprinting)
#
# See nginx/ja3_install.sh for a build script, or compile manually:
#   ./configure --add-module=/path/to/ngx_ssl_fingerprint_module && make && make install
#
# Then uncomment the ssl_ja3 lines below and change the X-JA3-Hash header
# from "" to $ssl_ja3_hash. Without the module, leave them commented out —
# everything else works without changes.

worker_processes auto;
error_log /var/log/nginx/ai_abyss_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with JA3 hash
    log_format ai_abyss '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'ja3="$http_x_ja3_hash" '
                           'rt=$request_time';

    access_log /var/log/nginx/ai_abyss_access.log ai_abyss;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep connections alive for slow-drip responses
    keepalive_timeout 300;
    send_timeout 600;
    proxy_read_timeout 600;
    proxy_send_timeout 600;

    # Don't reveal nginx version
    server_tokens off;

    # Rate limiting zone for admin endpoints
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # ── HTTPS server (production) ────────────────────────────────────

    server {
        listen 443 ssl;
        server_name yourdomain.com;

        ssl_certificate     /etc/ssl/certs/ai_abyss.pem;
        ssl_certificate_key /etc/ssl/private/ai_abyss.key;

        # TLS configuration — support wide range for fingerprinting diversity
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers off;  # Let client choose — reveals their preferences

        # TLS fingerprinting (requires ngx_ssl_fingerprint_module)
        # Extracts JA3/JA4 hash from TLS ClientHello and sets it as a variable.
        # Uncomment these lines when the fingerprint module is installed:
        # ssl_ja3 on;
        # ssl_ja3_hash on;

        # ── Proxy to FastAPI ──────────────────────────────────────────

        location / {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass JA3 hash to the application
            # When JA3 module is active, replace "" with $ssl_ja3_hash
            proxy_set_header X-JA3-Hash "";

            # Support streaming responses (slow-drip tar pit)
            proxy_buffering off;
            proxy_cache off;

            # Long timeouts for slow-drip responses
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # Admin endpoints — rate limited
        location /admin {
            limit_req zone=admin burst=20 nodelay;

            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Beacon callback — no rate limiting (we want all callbacks)
        location /callback {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Don't buffer — we want to log immediately
            proxy_buffering off;
        }
    }

    # ── HTTP redirect to HTTPS ───────────────────────────────────────

    server {
        listen 80;
        server_name yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # ── Development server (no SSL, no JA3) ──────────────────────────

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-JA3-Hash "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location /admin {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /callback {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }
    }
}
