# AI Abyss — Proof of Concept (2026)
# https://github.com/terrorswift/ai-abyss
# nginx reverse proxy config — optional, adds TLS fingerprinting and rate limiting
#
# Replace yourdomain.com with your actual domain.
# To enable JA3/JA4, compile nginx with ngx_ssl_fingerprint_module
# (see ja3_install.sh), then uncomment the ssl_ja3 lines below.

worker_processes auto;
error_log /var/log/nginx/ai_abyss_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format ai_abyss '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'ja3="$http_x_ja3_hash" '
                           'rt=$request_time';

    access_log /var/log/nginx/ai_abyss_access.log ai_abyss;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Long timeouts for slow-drip tarpit responses
    keepalive_timeout 300;
    send_timeout 600;
    proxy_read_timeout 600;
    proxy_send_timeout 600;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # HTTPS
    server {
        listen 443 ssl;
        server_name yourdomain.com;

        ssl_certificate     /etc/ssl/certs/ai_abyss.pem;
        ssl_certificate_key /etc/ssl/private/ai_abyss.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers off;

        # Uncomment when fingerprint module is installed:
        # ssl_ja3 on;
        # ssl_ja3_hash on;

        location / {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Replace "" with $ssl_ja3_hash when module is active
            proxy_set_header X-JA3-Hash "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location /admin {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /callback {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # Development (no SSL, no JA3)
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-JA3-Hash "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location /admin {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /callback {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }
    }
}
